{% extends "base.html" %}

{% block content %}
<style>
    .home-content {
        width: min(100% - 32px, 920px);
        margin: 34px auto 64px;
    }

    .home-card {
        margin-bottom: 34px;
        padding: 28px;
        background: #fff;
        border: 1px solid #e3eaf4;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgb(41 75 125 / 8%);
    }

    .card-heading {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        margin: 0 0 20px;
        color: #2054a4;
        font-size: 1.35rem;
    }

    .heading-icon { margin-right: 8px; }
    #shelterMap { height: 365px; border-radius: 10px; overflow: hidden; }

    .update-label { color: #219653; font-size: .95rem; white-space: nowrap; }
    .update-label::before { content: "↻"; margin-right: 6px; font-size: 1.25rem; }

    #weatherContent {
        min-height: 150px;
        padding: 18px 20px;
        background: #f7f9fc;
        border-radius: 10px;
    }

    .weather-area { margin: 0 0 12px; font-weight: 700; }
    .weather-clear { margin: 0 0 18px; color: #20934f; font-weight: 700; }
    .weather-clear::before { content: "●"; margin-right: 8px; }
    .weather-meta { margin: 7px 0; color: #66758b; font-size: .92rem; }
    .weather-warning { margin: 0 0 18px; color: #bd3c2d; font-weight: 700; }
    .weather-warning::before { content: "!"; display: inline-grid; width: 20px; height: 20px; margin-right: 8px; place-items: center; color: #fff; background: #d45142; border-radius: 50%; }

    @media (max-width: 600px) {
        .home-content { width: min(100% - 20px, 920px); margin-top: 20px; }
        .home-card { padding: 18px; margin-bottom: 20px; }
        .card-heading { align-items: flex-start; flex-direction: column; font-size: 1.15rem; }
        #shelterMap { height: 300px; }
    }
</style>

<div class="home-content">
    <section class="home-card" aria-labelledby="map-heading">
        <h2 id="map-heading" class="card-heading"><span><span class="heading-icon" aria-hidden="true">📍</span>避難所マップ</span></h2>
        <div id="shelterMap"></div>
    </section>

    <section class="home-card" aria-labelledby="weather-heading">
        <div class="card-heading">
            <h2 id="weather-heading" class="card-heading" style="margin: 0;">☁️ 青森市 気象警報・注意報</h2>
            <span class="update-label">10分おき自動更新</span>
        </div>
        <div id="weatherContent" aria-live="polite"><p>読み込み中...</p></div>
    </section>
</div>

<!-- Leaflet の読み込み -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    // 地図の初期化（青森市周辺を中心に設定）
    const map = L.map('shelterMap').setView([40.8246, 140.7400], 12);

    // OpenStreetMapタイルを追加
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors'
    }).addTo(map);

    // 気象警報・注意報の自動更新機能
    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                console.log('気象情報を更新しました:', data);
                updateWeatherContent(data);
            })
            .catch(error => {
                console.error('気象情報の更新に失敗しました:', error);
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = '<p>気象情報の取得に失敗しました</p>';
            return;
        }

        let warningsHtml = '';
        if (data.warnings && data.warnings.length > 0) {
            warningsHtml = '<div>';
            data.warnings.forEach(warning => {
                warningsHtml += `<p class="weather-warning">${warning.name}（${warning.status}）</p>`;
            });
            warningsHtml += '</div>';
        } else {
            warningsHtml = '<p class="weather-clear">現在、警報・注意報は発表されていません</p>';
        }

        weatherContent.innerHTML = `
            <p class="weather-area">📍 ${data.area_name || '青森市'}</p>
            ${warningsHtml}
            <p class="weather-meta">◷ データ取得: ${data.last_fetch_time || '更新中...'}</p>
            <p class="weather-meta">◒ 気象庁発表: ${data.report_time || '不明'}</p>
        `;
    }

    // 初回表示＋10分（600,000ミリ秒）おきに自動更新
    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
